apiVersion: apps/v1
kind: Deployment
metadata:
  name: jira-timesheet-sync
  labels:
    app: jira-timesheet-sync
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jira-timesheet-sync
  template:
    metadata:
      labels:
        app: jira-timesheet-sync
    spec:
      containers:
        - name: app
          image: jira-timesheet-sync:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: jira-timesheet-sync
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
